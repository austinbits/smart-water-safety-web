# Reference settings for the existing service. Do not create a duplicate service.
services:
  - type: web
    name: smart-water-safety-backend
    runtime: node
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://smart-water-safety-web.vercel.app
